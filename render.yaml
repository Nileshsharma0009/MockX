services:
  - type: web
    name: mockx-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: MONGODB_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: PAYMENTS_ENABLED
        value: "false"
      - key: PAYMENT_PRODUCT_ID
        sync: false
      - key: PAYMENT_PRODUCT_NAME
        sync: false
      - key: PAYMENT_PRODUCT_PRICE
        sync: false
      - key: PAYMENT_CURRENCY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
